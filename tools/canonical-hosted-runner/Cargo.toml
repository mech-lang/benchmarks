[package]
name = "mech-canonical-hosted-runner"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = ["canonical-native-benchmark-policy"]
canonical-native-benchmark-policy = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
mech-build = { git = "https://github.com/mech-lang/mech", rev = "bbd66acb9b3beacdc95356084df259ca172c8b98", default-features = false, features = ["process-supervision"] }

[dev-dependencies]
tempfile = "3.26"
