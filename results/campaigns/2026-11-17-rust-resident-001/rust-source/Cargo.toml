[package]
name = "mech-rust-controls"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde_json = "=1.0.154"
unicode-segmentation = "=1.13.3"
zlib-rs = { version = "=0.6.8", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
codegen-units = 1

[[bin]]
name = "resident"
path = "resident.rs"

[[bin]]
name = "deflate"
path = "deflate.rs"
